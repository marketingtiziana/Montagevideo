/* ==========================================================================
   Fynovates — « Dubaï, le stress test »
   Gabarit Instagram Story 1080 × 1920 (9:16 exact).

   Trois couches, dans cet ordre :
     1. la photo, avec le color grading commun aux 6 ;
     2. les dégradés de lisibilité — le dégradé principal de la série, plus
        deux renforts locaux, en haut pour la ligne d'en-tête et en bas pour
        le corps de texte ;
     3. le texte et le système graphique.

   Zones mortes : 160 px en haut, 300 px en bas (stickers Instagram).
   ========================================================================== */

:root {
  --or:      #D4AF37;
  --rouge:   #E05C5C;
  --gris:    #9CA3AF;
  --corps:   #E5E7EB;

  --marge:   100px;   /* marges latérales, identiques sur les 6 */
  --colonne: 800px;   /* largeur maximale du bloc texte */
  --haut:    160px;   /* ligne d'en-tête : rien au-dessus */
  --bas:     1620px;  /* 1920 − 300 : rien en dessous */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 1080px; height: 1920px; }

body {
  background: #040710;
  font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  font-feature-settings: 'kern' 1, 'liga' 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.story {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
}

/* ------------------------------------------------ couche 1 : la photographie */

.photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* grading uniforme sur les 6 */
  filter: saturate(0.85) contrast(1.08);
}

/* ------------------------------------------------- couche 2 : la lisibilité */

/* Dégradé principal : la photo reste lisible en haut, le texte vit dans la
   moitié basse assombrie. */
.grade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(6, 10, 22, 0.25) 0%,
    rgba(6, 10, 22, 0.55) 45%,
    rgba(4, 7, 16, 0.92) 100%
  );
}

/* Renfort haut : l'or (#D4AF37) a une luminance relative de 0,45. Pour tenir
   le 3:1 du « large text » il lui faut un fond sous 0,117 — autrement dit
   franchement noir. Plutôt que d'assombrir toute la moitié haute, le renfort
   est une bande courte, pleine sous la ligne d'en-tête puis en chute rapide :
   le sujet de la photo, qui vit en dessous de 360 px, reste intact. */
.renfort-haut {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 360px;
  background: linear-gradient(
    180deg,
    rgba(4, 7, 16, 0.84) 0%,
    rgba(4, 7, 16, 0.82) 55%,
    rgba(4, 7, 16, 0.34) 78%,
    rgba(4, 7, 16, 0) 100%
  );
}

/* Renfort bas : sous le bloc texte, là où l'or et le rouge doivent passer le
   AA même sur une photo claire. */
.renfort-bas {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 1180px;
  background: linear-gradient(
    180deg,
    rgba(4, 7, 16, 0) 0%,
    rgba(4, 7, 16, 0.45) 34%,
    rgba(4, 7, 16, 0.80) 68%,
    rgba(4, 7, 16, 0.88) 100%
  );
}

/* La story 6 est centrée et son bloc remonte : le renfort suit, avec une
   longue traîne pour ne pas poser d'arête visible en travers de l'image. */
.story--cta .renfort-bas {
  top: 240px;
  bottom: auto;
  height: 1500px;
  background: linear-gradient(
    180deg,
    rgba(4, 7, 16, 0) 0%,
    rgba(4, 7, 16, 0.52) 14%,
    rgba(4, 7, 16, 0.72) 45%,
    rgba(4, 7, 16, 0.60) 72%,
    rgba(4, 7, 16, 0.24) 89%,
    rgba(4, 7, 16, 0) 100%
  );
}

/* --------------------------------------------- couche 3 : en-tête de série */

.kicker,
.compteur {
  position: absolute;
  top: var(--haut);
  font-size: 24px;
  line-height: 1;
  text-transform: uppercase;
}

.kicker {
  left: var(--marge);
  color: var(--or);
  font-weight: 700;
  letter-spacing: 4px;
}

.compteur {
  right: var(--marge);
  color: var(--gris);
  font-weight: 600;
  letter-spacing: 3px;
}

/* ------------------------------------------------------ couche 3 : le texte */

.accroche {
  font-size: 60px;
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -0.015em;
  color: #FFFFFF;
  text-wrap: pretty;
}

.corps {
  font-size: 40px;
  font-weight: 400;
  line-height: 1.45;
  color: var(--corps);
  text-wrap: pretty;
}

.accroche + .corps { margin-top: 40px; }
.corps + .corps    { margin-top: 26px; }

/* Mots-clés. L'or porte le point de bascule, le rouge la sanction. */
em, i {
  font-style: normal;
  font-weight: 600;
}
em { color: var(--or); }
i  { color: var(--rouge); }

/* --- gabarits à texte ancré en bas : stories 1 à 5 ----------------------- */

.story--ouverture .contenu,
.story--chiffres .contenu,
.story--corps .contenu {
  position: absolute;
  left: var(--marge);
  bottom: calc(1920px - var(--bas));
  width: var(--colonne);
}

/* --- le relevé chiffré : story 2 ----------------------------------------- */

/* Sur cette story l'accroche n'est pas un titre mais une amorce : elle passe
   au corps de texte pour laisser les trois valeurs porter la hiérarchie. */
.story--chiffres .accroche {
  font-size: 40px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0;
  color: var(--corps);
}

.releve {
  margin: 48px 0 44px;
  border-top: 1px solid rgba(212, 175, 55, 0.45);
}

.ligne {
  display: flex;
  /* centré et non aligné sur la ligne de base : une légende qui passe sur deux
     lignes déséquilibrait visuellement sa rangée face au chiffre géant */
  align-items: center;
  gap: 28px;
  padding: 26px 0;
  border-bottom: 1px solid rgba(212, 175, 55, 0.45);
}

.valeur {
  /* colonne FIXE, pas un minimum : « 120 Md$ » mesure 309 px et débordait d'un
     min-width, ce qui décalait sa légende de 66 px par rapport aux deux autres */
  flex: 0 0 340px;
  /* une valeur ne se coupe jamais : « 120 Md$ » passait sur deux lignes et
     cassait l'alignement de la rangée. Le build refuse tout débordement. */
  white-space: nowrap;
  font-size: 76px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--or);
  font-variant-numeric: tabular-nums;
}

.legende {
  font-size: 32px;
  font-weight: 400;
  line-height: 1.3;
  color: var(--corps);
  text-wrap: pretty;
}

/* --- le CTA : story 6, centré -------------------------------------------- */

.story--cta .contenu {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(1920px - var(--bas));
  width: var(--colonne);
  margin: 0 auto;
  text-align: center;
}

.story--cta .corps { text-wrap: pretty; }

.cta {
  display: inline-block;
  margin-top: 70px;
  font-size: 132px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0.04em;
  /* le letter-spacing pousse un blanc après la dernière lettre : on le reprend
     pour que le mot reste optiquement centré dans son encadré */
  text-indent: 0.04em;
  color: var(--or);
  border: 2.5px solid var(--or);
  border-radius: 26px;
  padding: 26px 76px;
}

.consigne {
  margin-top: 44px;
  font-size: 38px;
  font-weight: 600;
  line-height: 1.4;
  color: #FFFFFF;
  text-wrap: balance;
}

</style>
</head>
<body>
  <div class="story story--ouverture">

    <!-- couche 1 : la photo et son grading -->
    <img class="photo" src="../backgrounds/bg-1.jpg" alt="">

    <!-- couche 2 : lisibilité -->
    <div class="grade"></div>
    <div class="renfort-bas"></div>
    <div class="renfort-haut"></div>

    <!-- couche 3 : en-tête de série -->
    <div class="kicker">Dubaï · Le stress test</div>
    <div class="compteur">1/6</div>

    <!-- couche 3 : le texte -->
    <div class="contenu">
        <p class="accroche">Il se passe un truc historique en ce moment. Et presque personne n’en tire la leçon.</p>
        <p class="corps">Dubaï, la destination qu’on te vend depuis 5 ans comme LE refuge, vit son premier vrai <em>stress test</em>.</p>
        <p class="corps">Et les chiffres parlent.</p>
    </div>

  </div>
</body>
</html>
