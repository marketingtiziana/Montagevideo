<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Scene v3</title>
<style>
@font-face{font-family:"PlexMono";src:url("IBMPlexMono-Bold.ttf");font-weight:700}
@font-face{font-family:"PlexMono";src:url("IBMPlexMono-Medium.ttf");font-weight:500}
:root{--ink:#0E1230;--grey:#6B7280;--line:#E6E8EF;--surf:#F5F6FA;--blue:#4353FF;--red:#FF6B6B;--green:#30D158}
html,body{margin:0;padding:0;background:#fff;width:1080px;height:1060px;overflow:hidden}
#stage{position:absolute;inset:0;width:1080px;height:1060px;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0;transform-origin:540px 530px}
.ch{position:absolute;inset:0;visibility:hidden;opacity:0;perspective:1800px}
.abs{position:absolute;transform-origin:center center;will-change:transform,opacity,filter}
.mono{font-family:PlexMono,monospace;font-weight:700;letter-spacing:-.04em}
/* devices */
.phone{position:absolute;width:390px;height:820px;border-radius:58px;background:var(--ink);padding:12px;box-sizing:border-box;box-shadow:0 40px 90px rgba(14,18,48,.18),0 8px 24px rgba(14,18,48,.10);transform-style:preserve-3d}
.phone .scr{position:absolute;left:12px;top:12px;right:12px;bottom:12px;border-radius:47px;background:#fff;overflow:hidden}
.phone .isl{position:absolute;left:50%;top:14px;width:110px;height:32px;margin-left:-55px;border-radius:20px;background:var(--ink);z-index:5}
.phone .sb{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:space-between;padding:0 34px;font-weight:700;font-size:16px;color:var(--ink)}
.win{position:absolute;border-radius:18px;background:#fff;box-shadow:0 30px 80px rgba(14,18,48,.16),0 2px 0 rgba(14,18,48,.04),0 0 0 1px var(--line);overflow:hidden;transform-style:preserve-3d}
.win .bar{height:44px;background:#F7F8FB;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;font-size:14px;font-weight:600;color:var(--grey)}
.win .bar i{width:12px;height:12px;border-radius:50%;background:#D7DAE3;display:block}
.win .bar .t{flex:1;text-align:center;letter-spacing:.02em}
.win .url{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--grey);min-width:220px;text-align:center}
.tab{position:absolute;border-radius:36px;background:var(--ink);padding:16px;box-sizing:border-box;box-shadow:0 40px 90px rgba(14,18,48,.18)}
.tab .scr{position:absolute;inset:16px;border-radius:24px;background:#fff;overflow:hidden}
/* ui */
.notif{position:absolute;left:14px;right:14px;background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 12px 30px rgba(14,18,48,.12),0 0 0 1px rgba(14,18,48,.04);padding:14px 16px 14px 14px;display:flex;gap:12px;align-items:flex-start;will-change:transform,opacity}
.notif .ic{width:40px;height:40px;border-radius:11px;background:var(--blue);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px}
.notif .tt{font-weight:800;font-size:15px;color:var(--ink);display:flex;justify-content:space-between}
.notif .tt span{font-weight:500;color:var(--grey);font-size:12px}
.notif .bd{font-size:14px;color:#3B4050;line-height:1.3;margin-top:2px}
.card{position:absolute;background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:18px 20px;box-sizing:border-box}
.lab{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--grey);text-transform:uppercase}
.kpi{font-family:PlexMono,monospace;font-weight:700;font-size:44px;letter-spacing:-.04em;color:var(--ink);margin-top:6px}
.row{position:absolute;left:28px;right:28px;height:62px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;box-sizing:border-box;font-weight:700;font-size:17px;color:var(--ink)}
.row .cb{width:26px;height:26px;border-radius:8px;border:2px solid #C9CDDA;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none}
.row .cb svg{width:16px;height:16px;opacity:0}
.toggle{width:52px;height:30px;border-radius:15px;background:var(--green);position:relative;flex:none}
.toggle b{position:absolute;top:3px;left:25px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tag{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-weight:800;border-radius:12px;padding:12px 18px;font-size:15px}
.cursor{display:inline-block;width:3px;height:1em;background:var(--blue);vertical-align:-2px;margin-left:2px}
#flash{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(67,83,255,0) 55%,rgba(67,83,255,.05) 100%);pointer-events:none}
</style></head>
<body><div id="stage">
<div class="layer" id="bgL"><div id="vig"></div></div>
<div class="layer" id="world"></div>
<div class="layer" id="fx"><div id="flash"></div></div>
</div>
<script src="gsap.min.js"></script><script src="remap.js"></script>
<script>
const W=1080,H=1060,CX=540,CY=530;
const C={ink:'#0E1230',grey:'#6B7280',line:'#E6E8EF',surf:'#F5F6FA',blue:'#4353FF',red:'#FF6B6B',green:'#30D158'};
const world=document.getElementById('world'), fx=document.getElementById('fx');
function el(tag,cls,style,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(html!=null)e.innerHTML=html;(parent||world).appendChild(e);return e;}
function chapter(){return el('div','ch',{},world);}
function svgEl(name,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function svgIn(parent,w,h){const s=svgEl('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});s.style.position='absolute';s.style.left=0;s.style.top=0;s.style.overflow='visible';parent.appendChild(s);return s;}
let seed=11;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
const master=gsap.timeline({paused:true});
window.__seek=t=>{master.seek(t,false);};
const R=(t)=>{const A=window.REMAP||[[0,0],[1000,1000]];if(t<=A[0][0])return A[0][1];for(let i=1;i<A.length;i++){if(t<=A[i][0]){const [a0,b0]=A[i-1],[a1,b1]=A[i];return a1===a0?b1:b0+(b1-b0)*(t-a0)/(a1-a0);}}return A[A.length-1][1]+(t-A[A.length-1][0]);};
const SPRING='elastic.out(1,0.6)', BACK='back.out(1.6)', SOFT='power3.out';
// ---------- helpers
function show(tl,ch,t){tl.set(ch,{visibility:'visible',opacity:1},R(t));}
function hide(tl,ch,t){tl.set(ch,{visibility:'hidden',opacity:0},R(t));}
function pop(tl,target,t,o={}){tl.fromTo(target,{scale:o.from??0.8,autoAlpha:0,y:o.y0??30},{scale:1,autoAlpha:1,y:0,duration:o.d??0.7,ease:o.ease??BACK},R(t));}
function slideNotif(tl,n,t,dir=-1){tl.fromTo(n,{y:dir*120,autoAlpha:0,scale:0.92},{y:0,autoAlpha:1,scale:1,duration:0.8,ease:'elastic.out(1,0.7)'},R(t));}
function float(tl,target,t,amp=6,per=3.2,rx=0,ry=0){const b=gsap.timeline({repeat:-1,yoyo:true});b.to(target,{y:`+=${amp}`,rotationX:rx,rotationY:ry,duration:per/2,ease:'sine.inOut'});tl.add(b,R(t));}
function tilt(tl,target,t,per=6){const b=gsap.timeline({repeat:-1,yoyo:true});b.fromTo(target,{rotationY:-4,rotationX:2},{rotationY:4,rotationX:-2,duration:per/2,ease:'sine.inOut'});tl.add(b,R(t));}
function drawPath(tl,path,t,d,ease='power2.inOut'){const L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L;tl.to(path,{strokeDashoffset:0,duration:d,ease},R(t));}
function glitch(tl,target,t){const T=R(t);tl.to(target,{x:-12,skewX:6,filter:'hue-rotate(120deg) contrast(1.4)',duration:1/30,ease:'none'},T).to(target,{x:10,skewX:-5,filter:'hue-rotate(-90deg)',duration:1/30,ease:'none'},T+1/30).to(target,{x:-4,skewX:2,filter:'contrast(1.2)',duration:1/30,ease:'none'},T+2/30).to(target,{x:0,skewX:0,filter:'none',duration:1/30,ease:'none'},T+3/30);
 tl.fromTo('#flash',{opacity:0},{opacity:.18,duration:1/30,ease:'none'},T).to('#flash',{opacity:0,duration:1/30},T+1/30).to('#flash',{opacity:.12,duration:1/30},T+3/30).to('#flash',{opacity:0,duration:2/30},T+4/30);}
function shake(t,amp=8){const T=R(t);master.to('#world',{x:-amp,y:amp*0.4,duration:1/30,ease:'none'},T).to('#world',{x:amp*0.8,y:-amp*0.3,duration:1/30,ease:'none'},T+1/30).to('#world',{x:-amp*0.3,duration:1/30,ease:'none'},T+2/30).to('#world',{x:0,y:0,duration:2/30,ease:'power2.out'},T+3/30);}
function ring(t,x,y,color=C.blue,size=700,d=0.9){const r=el('div','abs',{left:x+'px',top:y+'px',width:'400px',height:'400px',marginLeft:'-200px',marginTop:'-200px',borderRadius:'50%',border:`3px solid ${color}`,boxSizing:'border-box',opacity:0},fx);
 master.fromTo(r,{scale:0.1,opacity:0.55},{immediateRender:false,scale:size/400,opacity:0,duration:d,ease:'power3.out'},R(t));}
function glow(t,x,y,color='rgba(67,83,255,.22)',size=700,d=1.2){const g=el('div','abs',{left:x+'px',top:y+'px',width:size+'px',height:size+'px',marginLeft:(-size/2)+'px',marginTop:(-size/2)+'px',borderRadius:'50%',background:`radial-gradient(circle,${color} 0%,rgba(67,83,255,0) 65%)`,opacity:0},fx);
 master.fromTo(g,{opacity:0,scale:0.6},{opacity:1,scale:1,duration:d*0.35,ease:'power2.out',immediateRender:false},R(t)).to(g,{opacity:0,scale:1.25,duration:d*0.65,ease:'power2.in'},R(t)+d*0.35);}
function sweep(tl,target,t,d=0.9){const s=el('div','abs',{left:'-60%',top:'-20%',width:'45%',height:'140%',background:'linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%)',transform:'skewX(-18deg)',pointerEvents:'none',opacity:0},target);
 tl.fromTo(s,{x:0,opacity:1},{x:target.offsetWidth*2.4,opacity:1,duration:d,ease:'power2.inOut',immediateRender:false},R(t));tl.set(s,{opacity:0},R(t)+d+0.01);}
function zoomOut(tl,els,t,d=0.6){tl.to(els,{scale:1.25,autoAlpha:0,filter:'blur(14px)',duration:d,ease:'power3.in',transformOrigin:'540px 530px'},R(t));}
function zoomIn(tl,els,t,d=0.8){tl.fromTo(els,{scale:0.86,autoAlpha:0,filter:'blur(10px)'},{scale:1,autoAlpha:1,filter:'blur(0px)',duration:d,ease:SOFT},R(t));}
function typeText(tl,node,text,t,cps=14){for(let i=1;i<=text.length;i++){tl.set(node,{innerHTML:text.slice(0,i)+'<span class="cursor"></span>'},R(t)+i/cps);}}
function cursorBlink(tl,node,t,until){const b=gsap.timeline({repeat:-1});b.to(node,{opacity:0,duration:0.001},0.45).to(node,{opacity:1,duration:0.001},0.9);tl.add(b,R(t));}
// device builders
function phone(parent,x,y,scale=1){const p=el('div','phone abs',{left:x+'px',top:y+'px',transform:`scale(${scale})`},parent);el('div','isl',{},p);const s=el('div','scr',{},p);el('div','sb',{},s,'<span>09:41</span><span style="letter-spacing:-1px">▂▄▆</span>');return {p,s};}
function win(parent,x,y,w,h,title,url){const d=el('div','win abs',{left:x+'px',top:y+'px',width:w+'px',height:h+'px'},parent);const bar=el('div','bar',{},d,`<i></i><i></i><i></i><span class="t">${title}</span>${url?`<span class="url">${url}</span>`:''}`);const body=el('div','',{position:'absolute',left:0,right:0,top:'44px',bottom:0,background:'#fff'},d);return {d,body};}
function tablet(parent,x,y,w,h){const d=el('div','tab abs',{left:x+'px',top:y+'px',width:w+'px',height:h+'px'},parent);const s=el('div','scr',{},d);return {d,s};}
function notif(parent,top,title,body,icon='F',color=C.blue,time='maintenant'){return el('div','notif',{top:top+'px'},parent,`<div class="ic" style="background:${color}">${icon}</div><div style="flex:1"><div class="tt">${title}<span>${time}</span></div><div class="bd">${body}</div></div>`);}
function checkRow(parent,top,label,idx){const r=el('div','row',{top:top+'px'},parent,`<div class="cb"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span style="color:#9AA0B4;font-family:PlexMono,monospace;font-size:14px">0${idx}</span><span>${label}</span>`);return r;}
function checkOn(tl,row,t){const cb=row.querySelector('.cb');tl.to(cb,{background:C.green,borderColor:C.green,scale:1.15,duration:0.18,ease:'power2.out'},R(t)).to(cb,{scale:1,duration:0.3,ease:'elastic.out(1,0.5)'},R(t)+0.18);tl.to(cb.querySelector('svg'),{opacity:1,duration:0.15},R(t)+0.05);}
function nudge(t,dx){master.to('#world',{x:`+=${dx}`,duration:0.9,ease:'power3.inOut'},R(t)).to('#world',{x:0,duration:0.6,ease:'power3.inOut'},R(t)+0.9);}
// =====================================================================
// CH1 — HOOK: iPhone, notifications (0 → 8.6)
// =====================================================================
{const ch=chapter();const tl=gsap.timeline();show(tl,ch,0);
 const {p,s}=phone(ch,345,120,1);
 tl.fromTo(p,{y:120,autoAlpha:0,rotationX:14},{y:0,autoAlpha:1,rotationX:0,duration:1.0,ease:SOFT},R(0.05));
 tilt(tl,p,0.6,7);
 // lock screen clock
 const clock=el('div','abs mono',{left:0,right:0,top:'84px',textAlign:'center',fontSize:'86px',color:C.ink,letterSpacing:'-.05em'},s,'09:41');
 const date=el('div','abs',{left:0,right:0,top:'60px',textAlign:'center',fontSize:'17px',fontWeight:600,color:C.grey},s,'Lundi 3 novembre');
 tl.fromTo([date,clock],{autoAlpha:0,y:-10},{autoAlpha:1,y:0,duration:0.6,stagger:0.08},R(0.5));
 const n1=notif(s,250,'Registre des sociétés','Votre société étrangère est immatriculée.','S');
 const n2=notif(s,340,'Administration fiscale','Résidence fiscale : <b>inchangée</b>.','A',C.ink);
 const n3=notif(s,430,'Alerte','Contrôle fiscal programmé.','!',C.red);
 slideNotif(tl,n1,1.0);glow(1.05,540,420);
 tl.to(n1,{y:-8,duration:0.3,yoyo:true,repeat:1,ease:'sine.inOut'},R(2.3));
 slideNotif(tl,n2,3.3);ring(3.35,540,520,C.blue,500,0.8);
 // 'déplacer': n1 tries to leave the screen and bounces back
 tl.to(n1,{x:160,rotation:3,duration:0.5,ease:'power2.in'},R(3.3)).to(n1,{x:0,rotation:0,duration:1.0,ease:'elastic.out(1,0.4)'},R(3.9));
 // '?': badge
 const q=el('div','abs',{left:'300px',top:'190px',width:'56px',height:'56px',borderRadius:'50%',background:C.blue,color:'#fff',fontWeight:900,fontSize:'32px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 10px 24px rgba(67,83,255,.35)'},s,'?');
 pop(tl,q,4.6,{from:0.3,d:0.6});float(tl,q,5.3,5,2.2);
 // 'précisément là': cursor/marker on n2
 const mk=el('div','abs',{left:'22px',top:'340px',width:'4px',height:'70px',borderRadius:'2px',background:C.red,opacity:0},s);
 tl.fromTo(mk,{opacity:0,scaleY:0},{opacity:1,scaleY:1,duration:0.4,ease:BACK},R(5.85));
 // 'se font avoir': alert notification + glitch + shake
 slideNotif(tl,n3,8.0);glitch(tl,s,8.08);shake(8.08,10);ring(8.1,540,560,C.red,900,0.7);
 tl.to(n3,{boxShadow:'0 12px 30px rgba(255,107,107,.45),0 0 0 2px rgba(255,107,107,.6)',duration:0.1,repeat:5,yoyo:true},R(8.12));
 // exit: phone zooms out
 zoomOut(tl,p,8.5);hide(tl,ch,9.2);
 master.add(tl,0);}
// =====================================================================
// CH2 — MAP in a browser window (8.6 → 18.6)
// =====================================================================
{const ch=chapter();const tl=gsap.timeline();show(tl,ch,8.6);
 const {d,body}=win(ch,70,150,940,760,'Juridictions','fynovates.app/juridictions');
 zoomIn(tl,d,8.7);tilt(tl,d,9.6,9);
 // side panel
 const side=el('div','abs',{left:0,top:0,bottom:0,width:'300px',borderRight:'1px solid '+C.line,background:'#FAFBFD'},body);
 el('div','lab abs',{left:'24px',top:'22px'},side,'Pays sélectionnés');
 const items=[['Dubaï',12.8],['Estonie',13.64],['Autre pays',14.9]].map(([n,t],i)=>{const r=el('div','abs',{left:'16px',right:'16px',top:(60+i*70)+'px',height:'56px',borderRadius:'12px',background:'#fff',boxShadow:'0 0 0 1px '+C.line,display:'flex',alignItems:'center',gap:'12px',padding:'0 14px',boxSizing:'border-box',fontWeight:700,fontSize:'16px'},side,`<span style="width:12px;height:12px;border-radius:50%;background:${C.blue};display:block"></span>${n}`);
   tl.fromTo(r,{x:-40,autoAlpha:0},{x:0,autoAlpha:1,duration:0.5,ease:BACK},R(t));return r;});
 // toggle "imposition automatique"
 const tg=el('div','abs',{left:'16px',right:'16px',top:'300px',height:'66px',borderRadius:'12px',background:'#fff',boxShadow:'0 0 0 1px '+C.line,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 14px',boxSizing:'border-box',fontWeight:700,fontSize:'14px'},side,`<span>Impôts payés<br><span style="font-weight:500;color:${C.grey}">automatiquement là-bas</span></span><div class="toggle"><b></b></div>`);
 tl.fromTo(tg,{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:0.5},R(14.9));
 const knob=tg.querySelector('b'), tog=tg.querySelector('.toggle');
 tl.to(tog,{background:'#C9CDDA',duration:0.25},R(15.6));tl.to(knob,{left:'3px',duration:0.35,ease:'back.out(2)'},R(15.6));
 const non=el('div','tag abs',{left:'180px',top:'380px',background:C.red,color:'#fff'},side,'NON');
 pop(tl,non,15.7,{from:0.4,d:0.5});shake(15.65,6);ring(15.65,220,560,C.red,500,0.6);
 // map area
 const map=el('div','abs',{left:'300px',top:0,right:0,bottom:0,background:'#fff',overflow:'hidden'},body);
 const svg=svgIn(map,640,716);
 const land=[[150,220,150,80],[330,190,110,60],[500,230,120,70],[200,380,80,110],[420,380,110,80],[550,440,80,55],[300,520,140,60],[500,560,100,45]];
 const dots=[];for(let gx=20;gx<640;gx+=22)for(let gy=60;gy<716;gy+=22){let inside=false;for(const [cx,cy,rx,ry] of land){const dx=(gx-cx)/rx,dy=(gy-cy)/ry;if(dx*dx+dy*dy<1+(Math.sin(gx*0.13)+Math.cos(gy*0.11))*0.18)inside=true;}if(!inside)continue;dots.push(svgEl('circle',{cx:gx,cy:gy,r:3.2,fill:'#D5D9E6'},svg));}
 dots.forEach((dd,i)=>{tl.fromTo(dd,{opacity:0},{opacity:1,duration:0.4},R(9.0)+(i%23)*0.03);});
 const route=svgEl('path',{d:'M110 400 C 200 250, 300 180, 390 215 S 560 200, 560 330',fill:'none',stroke:C.blue,'stroke-width':4,'stroke-linecap':'round','stroke-dasharray':'10 10'},svg);
 drawPath(tl,route,11.5,2.3);
 const home=svgEl('circle',{cx:110,cy:400,r:9,fill:C.ink},svg);tl.fromTo(home,{opacity:0},{opacity:1,duration:0.3},R(9.4));
 const hp=svgEl('circle',{cx:110,cy:400,r:9,fill:'none',stroke:C.ink,'stroke-width':2},svg);const hpl=gsap.timeline({repeat:-1});hpl.fromTo(hp,{attr:{r:9},opacity:0.7},{attr:{r:40},opacity:0,duration:1.4,ease:'power2.out'});tl.add(hpl,R(9.6));
 const hl=el('div','tag abs',{left:'60px',top:'430px',background:C.ink,color:'#fff'},map,'RÉSIDENCE');pop(tl,hl,9.5,{from:0.6,d:0.5});
 function mark(x,y,label,t){const m=svgEl('circle',{cx:x,cy:y,r:9,fill:C.blue},svg);const pr=svgEl('circle',{cx:x,cy:y,r:9,fill:'none',stroke:C.blue,'stroke-width':2},svg);
   tl.fromTo(m,{opacity:0,attr:{r:0}},{opacity:1,attr:{r:9},duration:0.5,ease:BACK},R(t));const p=gsap.timeline({repeat:-1});p.fromTo(pr,{attr:{r:9},opacity:0.7},{attr:{r:36},opacity:0,duration:1.2,ease:'power2.out'});tl.add(p,R(t)+0.4);
