<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fynovates | Slide 16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
      src: url('../assets/fonts/Inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
      src: url('../assets/fonts/Inter-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
        U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
        U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1350px;
      overflow: hidden;
      background: #F4F6FC;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      font-variant-ligatures: none;
    }
    .slide {
      position: relative;
      width: 1080px; height: 1350px;
      overflow: hidden;
      background: #F4F6FC;
    }
    b  { font-weight: 900; color: #0F1535; }
    em { font-weight: 600; color: #0F1535; font-style: normal; }
    .logo {
      position: absolute; right: 90px; bottom: 56px;
      height: 40px; display: flex; align-items: center;
      font-weight: 900; font-size: 19px; letter-spacing: 0.20em;
      color: #0F1535; opacity: 0.45;
      z-index: 5;
    }
    .arrow {
      position: relative;
      width: 96px; height: 96px;
      border-radius: 50%;
      background: #4F6BFF;
      flex: none;
    }
    .arrow::before {
      content: '';
      position: absolute; left: 33px; top: 47px;
      width: 31px; height: 2px; background: #FFFFFF;
    }
    .arrow::after {
      content: '';
      position: absolute; left: 51px; top: 40px;
      width: 15px; height: 15px;
      border-top: 2px solid #FFFFFF;
      border-right: 2px solid #FFFFFF;
      transform: rotate(45deg);
    }
    /* halo froid : un degrade radial indigo sur fond navy. Aucune couleur
       chaude, le brand system n'interdit que les degrades orange et rouge. */
    html, body, .slide {
      background:
        radial-gradient(ellipse 1180px 820px at 50% 104%, #4F6BFF 0%, rgba(79, 107, 255, 0.55) 34%, rgba(79, 107, 255, 0) 70%),
        #0F1535;
    }
    /* 64px et non 90px : a 78px de corps, l'accroche demande 905px et la
       marge de 90px n'en laisse que 900. Elle cassait en deux lignes. */
    .frame {
      width: 100%; height: 100%;
      padding: 64px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .rule { width: 80px; height: 4px; background: #4F6BFF; }
    .cta {
      margin-top: 48px;
      font-weight: 900; font-size: 78px; line-height: 1.04;
      letter-spacing: -0.035em;
      text-align: center;
      color: #FFFFFF;
    }
    .arrow { margin-top: 60px; }
  </style>
</head>
<body>
<div class="slide" data-tpl="CTA" data-n="16">
  <div class="frame">
    <div class="rule"></div>
    <div class="cta" data-base="78" data-min="52">Abonne-toi pour la suite.</div>
    <div class="arrow"></div>
  </div>
</div>
</body>
</html>
