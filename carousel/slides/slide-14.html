<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fynovates | Slide 14</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
      src: url('../assets/fonts/Inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
      src: url('../assets/fonts/Inter-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
        U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
        U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1350px;
      overflow: hidden;
      background: #F4F6FC;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      font-variant-ligatures: none;
    }
    .slide {
      position: relative;
      width: 1080px; height: 1350px;
      overflow: hidden;
      background: #F4F6FC;
    }
    b  { font-weight: 900; color: #0F1535; }
    em { font-weight: 600; color: #0F1535; font-style: normal; }
    .logo {
      position: absolute; right: 90px; bottom: 56px;
      height: 40px; display: flex; align-items: center;
      font-weight: 900; font-size: 19px; letter-spacing: 0.20em;
      color: #0F1535; opacity: 0.45;
      z-index: 5;
    }
    .frame {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      padding: 90px;
      display: flex; flex-direction: column;
    }
    .num {
      font-weight: 900; font-size: 22px; letter-spacing: 0.14em;
      color: #4F6BFF;
      flex: none;
    }
    .title {
      margin-top: 44px;
      font-weight: 900; font-size: 56px; line-height: 1.08;
      letter-spacing: -0.015em;
      color: #0F1535;
      flex: none;
    }
    .body {
      margin-top: 44px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      font-weight: 400; font-size: 32px; line-height: 1.5;
      letter-spacing: -0.005em;
      color: #545E80;
    }
    .body > * + * { margin-top: 1em; }
    .body ul { list-style: none; }
    .body li { position: relative; padding-left: 1.05em; }
    .body li + li { margin-top: 0.62em; }
    .body li::before {
      content: '';
      position: absolute; left: 0; top: 0.62em;
      width: 8px; height: 8px;
      background: #4F6BFF;
    }
    /* --- schemas ------------------------------------------------ */
    .sch { margin-top: 1.25em; }

    /* KPI : une valeur seule devient un chiffre heros, deux ou trois
       deviennent une rangee de tuiles */
    .sch-kpi { display: flex; gap: 56px; }
    .sch-kpi .kpi { flex: 1 1 0; }
    .sch-kpi .kpi-key { width: 40px; height: 4px; background: #4F6BFF; }
    .sch-kpi .kpi-v {
      margin-top: 18px;
      font-weight: 900; line-height: 1;
      letter-spacing: -0.035em;
      color: #0F1535;
    }
    .sch-kpi .kpi-l {
      margin-top: 14px;
      font-weight: 400; line-height: 1.35;
      color: #545E80;
    }
    .sch-kpi[data-count="1"] .kpi-v { font-size: 118px; }
    .sch-kpi[data-count="1"] .kpi-l { font-size: 28px; }
    .sch-kpi[data-count="2"] .kpi-v { font-size: 86px; }
    .sch-kpi[data-count="2"] .kpi-l { font-size: 24px; }
    .sch-kpi[data-count="3"] { gap: 40px; }
    .sch-kpi[data-count="3"] .kpi-v { font-size: 64px; }
    .sch-kpi[data-count="3"] .kpi-l { font-size: 21px; }

    /* Barres horizontales : magnitude, serie unique */
    .sch-bars .row + .row { margin-top: 30px; }
    .sch-bars .row-l {
      font-weight: 600; font-size: 24px; line-height: 1.3;
      color: #0F1535;
    }
    /* La valeur suit immediatement le bout de la barre. La barre la plus longue
       est plafonnee a BAR_MAX% de la piste, ce qui garantit la place de
       l'etiquette sans jamais la detacher de sa marque ni la rogner. */
    .sch-bars .row-b {
      margin-top: 12px;
      display: flex; align-items: center;
    }
    .sch-bars .bar {
      height: 20px;
      border-radius: 0 4px 4px 0;
      background: #4F6BFF;
      flex: none;
    }
    .sch-bars .bar.dim { background: #C3CAE0; }
    .sch-bars .row-v {
      margin-left: 18px;
      font-weight: 900; font-size: 26px;
      color: #0F1535;
      white-space: nowrap;
    }
    .sch-bars .row.is-dim .row-l,
    .sch-bars .row.is-dim .row-v { color: #545E80; }

    /* Jauge : un rapport face a un seuil */
    .sch-meter .m-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 24px;
    }
    .sch-meter .m-cap { font-weight: 600; font-size: 24px; color: #0F1535; }
    .sch-meter .m-val { font-weight: 900; font-size: 44px; color: #0F1535; letter-spacing: -0.02em; }
    .sch-meter .m-track {
      position: relative;
      margin-top: 16px;
      height: 20px;
      border-radius: 4px;
      background: #DDE3F5;
      overflow: hidden;
    }
    .sch-meter .m-fill {
      height: 100%;
      border-radius: 0 4px 4px 0;
      background: #4F6BFF;
    }
    .sch-meter .m-tick {
      position: absolute; top: -6px; bottom: -6px;
      width: 2px; background: #0F1535;
    }
    .sch-meter .m-foot {
      margin-top: 14px;
      display: flex; justify-content: space-between; gap: 24px;
      font-weight: 400; font-size: 21px; color: #545E80;
    }

    /* Etapes : un enchainement */
    .sch-steps { list-style: none; }
    .sch-steps li {
      position: relative;
      padding-left: 74px;
      padding-bottom: 30px;
    }
    .sch-steps li:last-child { padding-bottom: 0; }
    .sch-steps li::before {
      content: '';
      position: absolute; left: 23px; top: 48px; bottom: 0;
      width: 2px; background: #E2E6F2;
    }
    .sch-steps li:last-child::before { display: none; }
    .sch-steps .s-n {
      position: absolute; left: 0; top: 0;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #4F6BFF;
      color: #FFFFFF;
      font-weight: 900; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .sch-steps .s-t {
      display: block;
      padding-top: 8px;
      font-weight: 400; font-size: 26px; line-height: 1.4;
      color: #545E80;
    }
    .sch-steps .s-t b { font-weight: 900; color: #0F1535; }

    /* Frise : des jalons dates */
    .sch-timeline { position: relative; padding-top: 4px; }
    /* l'axe court du premier au dernier jalon, jamais au-dela :
       les jalons sont ancres a gauche de cellules de largeur 100/n */
    .sch-timeline .t-axis {
      position: absolute; left: 7px; top: 63px;
      width: calc((100% - 14px) * var(--span) / var(--n));
      height: 1px; background: #E2E6F2;
    }
    .sch-timeline .t-row { position: relative; display: flex; }
    .sch-timeline .t-item { flex: 1 1 0; padding-right: 28px; }
    .sch-timeline .t-d {
      font-weight: 900; font-size: 26px; line-height: 1.2;
      color: #0F1535; letter-spacing: -0.015em;
      min-height: 62px;
    }
    .sch-timeline .t-dot {
      position: relative; z-index: 2;
      width: 14px; height: 14px; border-radius: 50%;
      background: #C3CAE0;
      box-shadow: 0 0 0 4px #F4F6FC;
    }
    .sch-timeline .t-item.on .t-dot { background: #4F6BFF; }
    .sch-timeline .t-l {
      margin-top: 20px;
      font-weight: 400; font-size: 21px; line-height: 1.4;
      color: #545E80;
    }

    /* Comparatif : deux colonnes, paire deux nuances */
    .sch-compare { display: flex; gap: 28px; }
    .sch-compare .cmp {
      flex: 1 1 0;
      padding: 28px 28px 30px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 1px solid #E2E6F2;
    }
    .sch-compare .c-key { width: 32px; height: 4px; background: #93A6FF; }
    .sch-compare .cmp.on .c-key { background: #4F6BFF; }
    .sch-compare .c-t {
      margin-top: 16px;
      font-weight: 600; font-size: 22px; color: #545E80;
    }
    .sch-compare .c-v {
      margin-top: 10px;
      font-weight: 900; font-size: 56px; line-height: 1;
      letter-spacing: -0.03em; color: #0F1535;
      font-variant-numeric: tabular-nums;
    }
    .sch-compare .c-d {
      margin-top: 14px;
      font-weight: 400; font-size: 21px; line-height: 1.4; color: #545E80;
    }
  </style>
</head>
<body>
<div class="slide" data-tpl="B" data-n="14">
  <div class="frame">
    <div class="num">14 / 16</div>
    <h1 class="title">Titre provisoire slide 14</h1>
    <div class="body" data-base="32" data-min="26">
      <p>Texte provisoire. Demonstration de la forme emphase : une barre porte l information, les autres font contexte.</p>
    <div class="sch sch-bars">
      <div class="row is-dim">
        <div class="row-l">Contexte provisoire un</div>
        <div class="row-b">
          <div class="bar dim" style="width: 22%"></div>
          <div class="row-v">1 200</div>
        </div>
      </div>
      <div class="row">
        <div class="row-l">Point cle provisoire</div>
        <div class="row-b">
          <div class="bar" style="width: 78%"></div>
          <div class="row-v">4 300</div>
        </div>
      </div>
      <div class="row is-dim">
        <div class="row-l">Contexte provisoire deux</div>
        <div class="row-b">
          <div class="bar dim" style="width: 16%"></div>
          <div class="row-v">900</div>
        </div>
      </div>
    </div>
    </div>
  </div>
</div>
</body>
</html>
