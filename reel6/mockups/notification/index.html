<!doctype html>
<!-- Reel 6, element 19 — generic iOS-style notification that drops in at the top of the phone screen.
     Illustration only: no official logo, no amount, no sender name. 660x200 (displayed at 330x100), 2.8 s, rendered to .mov alpha. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: I; src: url(Inter.ttf); font-weight: 100 900; }
html, body { margin: 0; background: transparent; width: 660px; height: 200px; overflow: hidden; font-family: I; }
:root { --acc: #FFC83D; --acc2: #E5484D; }
.n { position: absolute; left: 12px; top: 14px; width: 636px; height: 150px; border-radius: 40px; background: rgba(246,246,248,.96);
  box-shadow: 0 16px 48px rgba(0,0,0,.35); transform: translateY(-190px); opacity: 0;
  animation: drop .5s cubic-bezier(.2,.8,.2,1) .05s forwards, settle .25s cubic-bezier(.2,.8,.2,1) .55s forwards; }
@keyframes drop { 0% { transform: translateY(-190px); opacity: 0 } 40% { opacity: 1 } 100% { transform: translateY(8px); opacity: 1 } }
@keyframes settle { from { transform: translateY(8px) } to { transform: translateY(0) } }
.ic { position: absolute; left: 28px; top: 33px; width: 84px; height: 84px; border-radius: 20px; background: #1C1C1E; }
.ic svg { position: absolute; left: 20px; top: 20px; width: 44px; height: 44px; }
.dot { position: absolute; left: 92px; top: 25px; width: 26px; height: 26px; border-radius: 50%; background: var(--acc2); border: 4px solid rgba(246,246,248,1); }
.app { position: absolute; left: 136px; top: 30px; font-size: 25px; font-weight: 600; color: #6E6E73; letter-spacing: .4px; }
.time { position: absolute; right: 34px; top: 30px; font-size: 24px; color: #8E8E93; }
.t { position: absolute; left: 136px; top: 64px; font-size: 32px; font-weight: 700; color: #111; }
.b { position: absolute; left: 136px; top: 104px; font-size: 27px; font-weight: 500; color: #3A3A3C; }
</style></head><body>
<div class="n">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#FFC83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></div>
  <div class="dot"></div>
  <div class="app">RAPPEL</div><div class="time">maintenant</div>
  <div class="t">Cotisations sociales</div>
  <div class="b">Une échéance est à régler.</div>
</div>
</body></html>
