<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slide 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=block" rel="stylesheet">
<style>
:root { --bg: #4F6BFF; --fg: #0F1535; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.block { width: 100%; max-width: 840px; text-align: center; }
p { font-weight: 900; font-size: 80px; line-height: 1.15; text-wrap: balance; }
p + p { margin-top: 0.6em; }
</style>
</head>
<body>
  <main class="block">
    <p>N'oublie pas de t'abonner</p>
  </main>
</body>
</html>
