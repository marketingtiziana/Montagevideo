<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slide 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=block" rel="stylesheet">
<style>
:root { --bg: #1A2E24; --fg: #C9D8CC; --body-size: 34px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.block { width: 100%; max-width: 840px; text-align: center; }
h1 { font-weight: 900; font-size: 52px; line-height: 1.2; margin-bottom: 48px; text-wrap: balance; }
p { font-weight: 400; font-size: var(--body-size); line-height: 1.55; text-wrap: pretty; }
p + p { margin-top: 0.8em; }
strong { font-weight: 900; }
p.item:not(.first) { margin-top: 0.35em; }
p.mail { font-weight: 600; }
</style>
</head>
<body>
  <main class="block">
    <h1>L’instabilité est devenue la norme</h1>
    <p>Les règles changent plus vite que tu ne peux t’y adapter.</p>
    <p>Une annonce chasse la précédente. Ce qui était prévu en janvier n’est plus vrai en juin.</p>
    <p>Et toi, tu dois prendre des décisions à trois ans avec une visibilité à trois mois.</p>
  </main>
</body>
</html>
