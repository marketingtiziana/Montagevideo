<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slide 09</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=block" rel="stylesheet">
<style>
:root { --bg: #0C1812; --fg: #9BBFA6; --body-size: 34px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.block { width: 100%; max-width: 840px; text-align: center; }
h1 { font-weight: 900; font-size: 52px; line-height: 1.2; margin-bottom: 48px; text-wrap: balance; }
p { font-weight: 400; font-size: var(--body-size); line-height: 1.55; text-wrap: pretty; }
p + p { margin-top: 0.8em; }
strong { font-weight: 900; }
p.item:not(.first) { margin-top: 0.35em; }
p.mail { font-weight: 600; }
</style>
</head>
<body>
  <main class="block">
    <h1>Le piège de la résidence fiscale</h1>
    <p>Quitter la France physiquement ne suffit pas à la quitter fiscalement.</p>
    <p>Si tes intérêts restent ici, l’administration peut considérer que tu n’es jamais vraiment partie.</p>
    <p><strong>Une expatriation se prouve. Elle ne se déclare pas.</strong></p>
  </main>
</body>
</html>
