<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slide 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=block" rel="stylesheet">
<style>
:root { --bg: #D6E2D8; --fg: #1A2E24; --body-size: 34px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.block { width: 100%; max-width: 840px; text-align: center; }
h1 { font-weight: 900; font-size: 52px; line-height: 1.2; margin-bottom: 48px; text-wrap: balance; }
p { font-weight: 400; font-size: var(--body-size); line-height: 1.55; text-wrap: pretty; }
p + p { margin-top: 0.8em; }
strong { font-weight: 900; }
p.item:not(.first) { margin-top: 0.35em; }
p.mail { font-weight: 600; }
</style>
</head>
<body>
  <main class="block">
    <h1>Pour qui</h1>
    <p>Pour les entrepreneures, indépendantes et dirigeantes qui veulent :</p>
    <p class="item first">• Plus de stabilité pour construire sur le long terme</p>
    <p class="item">• Un cadre fiscal et administratif plus lisible</p>
    <p class="item">• Une vie qui leur ressemble davantage</p>
    <p>Et qui veulent le faire sérieusement, sans improviser.</p>
  </main>
</body>
</html>
