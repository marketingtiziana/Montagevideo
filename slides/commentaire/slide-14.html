<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slide 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=block" rel="stylesheet">
<style>
:root { --bg: #C9A7D3; --fg: #1A0B24; --body-size: 34px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.block { width: 100%; max-width: 840px; text-align: center; }
h1 { font-weight: 900; font-size: 52px; line-height: 1.2; margin-bottom: 48px; text-wrap: balance; }
p { font-weight: 400; font-size: var(--body-size); line-height: 1.55; text-wrap: pretty; }
p + p { margin-top: 0.8em; }
strong { font-weight: 900; }
</style>
</head>
<body>
  <main class="block">
    <h1>Ce qu’il faut retenir</h1>
    <p>Ça va arriver. Ce n’est pas une possibilité, c’est une certitude dès que tu seras visible.</p>
    <p>Ça te fera mal, et ça ne dit rien de ta solidité.</p>
    <p>Ce qui compte, ce n’est pas de ne rien ressentir.</p>
    <p>C’est de finir la semaine en ayant publié quand même.</p>
  </main>
</body>
</html>
