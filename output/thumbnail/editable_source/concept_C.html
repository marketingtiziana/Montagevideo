<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>FYNOVATES — Concept C</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
/* CONCEPT C — HIGH-IMPACT EDITORIAL
   Near-black field, tight dominant portrait, headline set like a magazine cover:
   "QUITTER" huge, "LA FRANCE ?" knocked out of a white block echoing the logo's square. */
html, body { background: #0F0A13; }
.bg { background:
  radial-gradient(560px 600px at 930px 330px, rgba(38,28,110,.95), rgba(13,8,46,.35) 55%, rgba(15,10,19,0) 80%),
  linear-gradient(90deg, #0F0A13 0%, #0F0A13 40%, #120C2A 100%); }
.portrait { height: 1440px; left: 357px; top: -30px;
  filter: drop-shadow(0 0 .8px rgba(170,160,255,.22)) drop-shadow(-40px 0 60px rgba(0,0,0,.75)); }
.fade { background: linear-gradient(0deg, rgba(15,10,19,.85) 0%, rgba(15,10,19,0) 18%); }
.text { position: absolute; left: 60px; top: 150px; }
.text .vline { position: static; margin: 0 0 34px 4px; }
.l1 { letter-spacing: -.035em; }
.block { display: inline-block; background: #fff; color: #0D082E; padding: 12px 18px 10px 16px; margin-top: 14px; }
.l2 { letter-spacing: -.03em; line-height: .86; }
.sub { margin-top: 30px; font-size: 26px; font-weight: 600; letter-spacing: .005em; color: #fff; }
.sub span { color: rgba(255,255,255,.6); font-weight: 500; }
.logo { left: 60px; bottom: 50px; gap: 14px; }
.logo .sym { height: 38px; }
.logo .wm { height: 14px; }
.vline { width: 56px; height: 4px; background: #fff; }
</style></head>
<body><div class="frame">
  <div class="layer bg"></div>
  <img class="portrait" src="assets/portrait_cutout.png" alt="">
  <div class="layer fade"></div>
  <div class="text">
    <div class="vline"></div>
    <div><span class="h l1" data-fit="552">QUITTER</span></div>
    <div class="block"><span class="h l2" data-fit="518">LA FRANCE&#8239;?</span></div>
    <div class="sub">Ce qu’il faut savoir <span>avant de partir</span></div>
  </div>
  <div class="logo"><img class="sym" src="assets/logo_symbol_white.png" alt=""><img class="wm" src="assets/logo_wordmark_white.png" alt="FYNOVATES"></div>
  <div class="grain"></div>
</div></body></html>
