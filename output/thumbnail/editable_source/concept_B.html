<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>FYNOVATES — Concept B</title>
<link rel="stylesheet" href="common.css">
<script src="assets/geo.js"></script><script src="common.js"></script>
<style>
/* CONCEPT B — INTERNATIONAL TAX STRATEGY
   Cartographic story: France lit on a dark Europe, a route leaves Paris toward a new tax residence. */
.bg { background:
  radial-gradient(620px 560px at 1010px 280px, rgba(40,31,112,.80), rgba(13,8,46,0) 70%),
  radial-gradient(700px 520px at 260px 600px, rgba(28,21,84,.70), rgba(13,8,46,0) 72%),
  linear-gradient(180deg, #0D082E 0%, #0A0624 100%); }
/* Europe map, scale 1.1, positioned so France sits bottom-left */
.europe { position: absolute; left: -160px; top: -29px; width: 1253px; height: 1100px;
  -webkit-mask-image: radial-gradient(520px 420px at 436px 560px, #000 35%, transparent 100%); }
.overlay { position: absolute; inset: 0; }
.portrait { height: 912px; left: 640px; top: 30px;
  filter: drop-shadow(0 0 .8px rgba(170,160,255,.22)) drop-shadow(-30px 10px 50px rgba(4,2,16,.7)); }
.fade { background: linear-gradient(0deg, rgba(10,6,36,.95) 0%, rgba(10,6,36,0) 20%); }
.logo { left: 64px; top: 50px; gap: 14px; }
.logo .sym { height: 40px; }
.logo .wm { height: 15px; }
.text { position: absolute; left: 64px; top: 128px; }
.eyebrow { margin-bottom: 18px; }
.l2 { margin-top: 4px; }
.lab { font: 600 13px/1 "FYN"; letter-spacing: .26em; fill: rgba(255,255,255,.85); }
.coord { font: 500 11px/1 "FYN"; letter-spacing: .14em; fill: rgba(255,255,255,.5); }
</style></head>
<body><div class="frame">
  <div class="layer bg"></div>
  <svg class="europe" data-geo="europe" preserveAspectRatio="none">
    <defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter></defs>
    <path data-d="land" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
    <path data-d="france" fill="none" stroke="rgba(150,140,255,.55)" stroke-width="7" filter="url(#glow)"/>
    <path data-d="france" fill="rgba(42,32,120,.75)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <!-- route Paris -> new residence (screen coordinates) -->
  <svg class="overlay" width="1280" height="720">
    <g fill="none" stroke-linecap="round">
      <path d="M276 487 C 400 380, 590 372, 712 432" stroke="rgba(255,255,255,.9)" stroke-width="2.4" stroke-dasharray="2 9"/>
    </g>
    <circle cx="276" cy="487" r="14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
    <circle cx="276" cy="487" r="5.5" fill="#fff"/>
    <text class="lab" x="276" y="522" text-anchor="middle">PARIS</text>
    <text class="coord" x="276" y="541" text-anchor="middle">48°51′N · 2°21′E</text>
    <circle cx="712" cy="432" r="18" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
    <rect x="706" y="426" width="12" height="12" fill="#fff"/>
  </svg>
  <img class="portrait" src="assets/portrait_cutout.png" alt="">
  <div class="layer fade"></div>
  <div class="logo"><img class="sym" src="assets/logo_symbol_white.png" alt=""><img class="wm" src="assets/logo_wordmark_white.png" alt="FYNOVATES"></div>
  <div class="text">
    <div class="eyebrow">Stratégie fiscale internationale</div>
    <div><span class="h l1" data-fit="540">QUITTER</span></div>
    <div><span class="h l2" data-fit="540">LA FRANCE&#8239;?</span></div>
  </div>
  <div class="grain"></div>
</div></body></html>
