<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <title>FYNOVATES — Quitter la France ? — The Private Departure</title>
  <defs>
    <style>
      @font-face { font-family: "FYN Display"; font-weight: 800; src: url("fonts/InterDisplay-ExtraBold.otf"); }
      @font-face { font-family: "FYN Display"; font-weight: 500; src: url("fonts/InterDisplay-Medium.otf"); }
      .head { font-family: "FYN Display", "Inter Display", Inter, "Helvetica Neue", sans-serif; font-weight: 800; fill: #FFFFFF; }
      .sub  { font-family: "FYN Display", "Inter Display", Inter, "Helvetica Neue", sans-serif; font-weight: 500; fill: #FFFFFF; }
    </style>
    <!-- readability: left side falls into navy, floor falls into near-black -->
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D082D" stop-opacity=".8"/>
      <stop offset=".34" stop-color="#0D082D" stop-opacity=".45"/>
      <stop offset=".58" stop-color="#0D082D" stop-opacity=".06"/>
      <stop offset=".7" stop-color="#0D082D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0F0A13" stop-opacity=".9"/>
      <stop offset=".3" stop-color="#0F0A13" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0A13" stop-opacity=".45"/>
      <stop offset=".2" stop-color="#0F0A13" stop-opacity="0"/>
    </linearGradient>
    <!-- blue-hour window light falling on her from the glass (left) -->
    <radialGradient id="gKey" cx="956.5" cy="262.0" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".42" stop-color="#0F0A13" stop-opacity="0"/><stop offset=".74" stop-color="#0F0A13" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D082D" stop-opacity=".34"/><stop offset=".45" stop-color="#0D082D" stop-opacity="0"/>
    </linearGradient>
    <mask id="mSubject" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="604" y="22" width="750.0" height="1000">
      <image href="assets/portrait_cutout.png" x="604" y="22" width="750.0" height="1000"/>
    </mask>
    <filter id="fSubject" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-26" dy="14" stdDeviation="22" flood-color="#030210" flood-opacity=".7"/>
    </filter>
    <filter id="fProp" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#030210" flood-opacity=".75"/>
    </filter>
    <filter id="fHead" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#05031a" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- 1 · BACKGROUND — private terminal at blue hour (generated plate, brand-graded) -->
  <g id="background">
    <rect width="1280" height="720" fill="#0D082D"/>
    <image id="plate" href="assets/plate_private_terminal_graded.jpg" x="-70" y="-40" width="1420" height="798.8" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1280" height="720" fill="url(#gLeft)"/>
    <rect width="1280" height="720" fill="url(#gTop)"/>
    <rect width="1280" height="720" fill="url(#gFloor)"/>
  </g>

  <!-- 2 · SUBJECT — original photograph, cutout, aspect ratio locked -->
  <g id="portrait">
    <image href="assets/portrait_cutout.png" x="604" y="22" width="750.0" height="1000" filter="url(#fSubject)"/>
    <g mask="url(#mSubject)">
      <rect x="604" y="22" width="750.0" height="1000" fill="url(#gSide)"/>
      <rect x="604" y="22" width="750.0" height="1000" fill="url(#gBody)"/>
      <rect x="604" y="22" width="750.0" height="1000" fill="url(#gKey)" style="mix-blend-mode:screen"/>
    </g>
  </g>

  <!-- 3 · FOREGROUND — passport on the stone floor (generated, generic, no emblem / data) -->
  <g id="passport" filter="url(#fProp)">
    <image href="assets/passport_luxe_graded.png" x="40" y="496" width="410" height="241.3" transform="rotate(-6 245.0 616.7)"/>
  </g>
  <rect y="600" width="560" height="120" fill="url(#gFloor)" opacity=".7"/>

  <!-- 4 · TYPOGRAPHY — live text -->
  <g id="headline" filter="url(#fHead)">
    <text class="head" x="62" y="220.8" font-size="97.32" letter-spacing="-2.14">QUITTER</text>
    <text class="head" x="62" y="316.1" font-size="97.32" letter-spacing="-2.14">LA FRANCE ?</text>
  </g>
  <g id="subline">
    <rect x="66" y="350.1" width="44" height="2" fill="#FFFFFF"/>
    <text class="sub" x="66" y="380.1" font-size="16.5" letter-spacing="4.4" fill-opacity=".9">AVANT DE PRENDRE VOTRE DÉCISION</text>
  </g>

  <!-- 5 · BRAND — original FYNOVATES symbol + wordmark (pixels from the supplied files) -->
  <g id="logo">
    <image href="assets/logo_symbol_white.png" x="62" y="42" width="40" height="40"/>
    <image href="assets/logo_wordmark_white.png" x="116" y="54.5" width="92.9" height="15"/>
  </g>
</svg>
