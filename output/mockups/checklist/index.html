<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 960px; height: 580px; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .card { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: max-content; box-sizing: border-box; padding: 40px 64px 34px 48px;
          background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  .title { font-weight: 700; font-size: 28px; letter-spacing: 3px; color: var(--accent); margin-bottom: 22px; }
  .row { display: flex; align-items: center; height: 76px; }
  .box { position: relative; width: 44px; height: 44px; flex: none; border-radius: var(--radius-sm);
         border: 3px solid var(--muted); box-sizing: border-box; margin-right: 26px; }
  .box svg { position: absolute; left: -3px; top: -3px; width: 44px; height: 44px; }
  .label { position: relative; font-weight: 700; font-size: 40px; color: var(--principal); white-space: nowrap; }
  .strike { position: absolute; left: -4px; top: 52%; height: 4px; border-radius: 2px; background: var(--muted); width: 0; }
  .last .label { color: var(--accent); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="title">AVANT DE S'ASSOCIER</div>
  <div id="rows"></div>
</div>
<script>
// Contenu = mots du script validé (transcript.json), aucun ajout.
const ITEMS = ["Tester la personne", "Collaborer", "Voir les périodes basses", "Voir les périodes hautes", "Et ensuite, s'associer"];
const rows = document.getElementById("rows");
ITEMS.forEach((t, i) => {
  const r = document.createElement("div"); r.className = "row" + (i === ITEMS.length - 1 ? " last" : "");
  r.innerHTML = `<div class="box"><svg viewBox="0 0 44 44"><path d="M 11 23 L 19 31 L 34 14" fill="none" stroke="#0F0F12" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>
    <div class="label">${t}<div class="strike"></div></div>`;
  rows.appendChild(r);
});
// Easing unique du reel : cubic-bezier(0.2, 0.8, 0.2, 1)
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (t) => ((ax * t + bx) * t + cx) * t, Y = (t) => ((ay * t + by) * t + cy) * t, dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => { let t = x; for (let i = 0; i < 8; i++) { const e = X(t) - x; if (Math.abs(e) < 1e-6) break; t -= e / (dX(t) || 1e-6); }
    return Y(Math.min(1, Math.max(0, t))); };
}
const EASE = bezier(0.2, 0.8, 0.2, 1);
const prog = (t, a, d) => EASE(Math.min(1, Math.max(0, (t - a) / d)));
// T = { ticks: [s…] (secondes depuis le début du mockup), dur }
window.renderAt = (t, T) => {
  document.querySelectorAll(".row").forEach((r, i) => {
    const inP = prog(t, 0.15 * i, 0.3);                       // lignes qui apparaissent une par une, 0,15 s d'écart
    r.style.opacity = inP; r.style.transform = `translateY(${(1 - inP) * 14}px)`;
    const k = T.ticks[i], box = r.querySelector(".box"), path = r.querySelector("path");
    const fill = prog(t, k, 0.12), draw = prog(t, k + 0.05, 0.3), strike = prog(t, k + 0.2, 0.3);
    box.style.background = fill > 0 ? `rgba(242,181,68,${fill})` : "transparent";
    box.style.borderColor = fill > 0 ? "var(--accent)" : "";
    path.setAttribute("stroke-dashoffset", String(1 - draw));   // coche SVG qui se trace en 0,3 s
    const last = i === ITEMS.length - 1;
    if (!last) {
      const lab = r.querySelector(".label"), s = r.querySelector(".strike");
      s.style.width = `${strike * (lab.offsetWidth + 8)}px`;     // item barré
      lab.style.color = `rgba(255,255,255,${1 - 0.45 * strike})`;
    } else {
      const pulse = Math.sin(Math.PI * Math.min(1, Math.max(0, (t - k) / 0.35)));
      r.style.transform += ` scale(${1 + 0.04 * pulse})`; r.style.transformOrigin = "left center";
    }
  });
};
</script>
</body>
</html>
