<!doctype html>
<!-- CTA mockup « LE CODEX HONG KONG » — CSS 3D book, rendered frame by frame (60 fps, 6 s) to a .mov with alpha by tools/render_mockup.py.
     Cover art: Higgsfield generate_image (no AI text). Title, lines and specular sweep are HTML/CSS. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:600;src:url(fonts/m600.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/m800.woff2)}
@font-face{font-family:M;font-weight:900;src:url(fonts/m900.woff2)}
html,body{margin:0;width:900px;height:1100px;background:transparent;overflow:hidden}
.stage{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 45%}
.float{position:absolute;left:170px;top:150px;width:560px;height:746px;transform-style:preserve-3d;animation:float 5.2s linear .8s both}
.book{position:absolute;inset:0;transform-style:preserve-3d;animation:open .8s cubic-bezier(.2,.8,.2,1) both}
.face{position:absolute;backface-visibility:hidden}
.cover{inset:0;background:url(cover.png) center/cover;border-radius:4px 14px 14px 4px;
  box-shadow:0 8px 32px rgba(0,0,0,.45), inset 6px 0 10px rgba(0,0,0,.6);transform:translateZ(22px);overflow:hidden}
.spine{left:-22px;top:0;width:44px;height:746px;background:linear-gradient(90deg,#050505,#1c1c1c 45%,#0a0a0a);transform:rotateY(-90deg)}
.pages{right:-21px;top:8px;width:42px;height:730px;background:repeating-linear-gradient(90deg,#efe8d8 0 2px,#d9d0bd 2px 3px);transform:rotateY(90deg) translateZ(539px)}
.back{inset:0;background:#0b0b0b;border-radius:14px 4px 4px 14px;transform:translateZ(-22px) rotateY(180deg)}
.title{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:M;color:#fff}
.kicker{font-weight:600;font-size:30px;letter-spacing:14px;color:#E8B04A;margin-bottom:18px;padding-left:14px}
.big{font-weight:900;font-size:86px;line-height:.95;letter-spacing:1px}
.rule{width:120px;height:3px;background:#E8B04A;margin:30px auto 22px}
.sub{font-weight:600;font-size:21px;letter-spacing:3px;color:rgba(255,255,255,.75)}
.spec{position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,240,210,.0) 44%,rgba(255,240,210,.38) 50%,rgba(255,240,210,0) 56%,transparent 60%);
  animation:sweep 1.1s cubic-bezier(.2,.8,.2,1) .45s both;mix-blend-mode:screen}
.glow{position:absolute;left:120px;top:880px;width:660px;height:90px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);animation:shadow 5.2s linear .8s both}
@keyframes open{from{transform:rotateY(-25deg) rotateX(4deg) translateZ(-60px)}to{transform:rotateY(0) rotateX(0) translateZ(0)}}
@keyframes sweep{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
@keyframes float{0%{transform:translateY(0) rotateY(0deg)}25%{transform:translateY(-10px) rotateY(-4deg)}50%{transform:translateY(0) rotateY(0deg)}75%{transform:translateY(-10px) rotateY(4deg)}100%{transform:translateY(0) rotateY(0deg)}}
@keyframes shadow{0%,50%,100%{opacity:1}25%,75%{opacity:.8}}
</style></head><body><div class="stage">
<div class="glow"></div>
<div class="float"><div class="book">
  <div class="face back"></div><div class="face spine"></div><div class="face pages"></div>
  <div class="face cover"><div class="title"><div class="kicker">LE CODEX</div><div class="big">HONG<br>KONG</div><div class="rule"></div>
    <div class="sub">CRÉATION · BANQUE · OFFSHORE</div></div><div class="spec"></div></div>
</div></div></div></body></html>
